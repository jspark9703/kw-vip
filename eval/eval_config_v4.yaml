# scene_v4 평가 설정 — 평가 '전에' 고정한다. 실패한 시도도 빼지 않는다.
# 작업: 텍스트 명령 -> 아파트 복도 주행(택배·사람 우회) -> 도어락 확인·도킹 -> 키 글자 판독 -> 등록 비밀번호 + '#' 입력(키마다 피드백)
#       -> 상태 LED 로 열림 판단
# 성공 기준: 도어락이 열림(마지막 '*' 이후 입력 = 비밀번호 + '#') 이고 휠체어-벽/장애물 충돌 0 스텝
#           (움직이면 안 되는 명령: 키 입력 0, 모든 키 최대 변위 < 1mm)
# 종료 조건: 미션 상태 기계가 DONE 에 도달하거나 시뮬레이션 시간 240s 초과(timeout)
# 실패 유형: nlu / nav(주행 시간 초과·막힘) / nav_collision / panel_not_found / dock / ik / digit(필요한 키 판독 실패)
#           press_no_contact / wrong_key / unlock_failed / timeout / moved_when_forbidden
# 비밀번호: 시드마다 4~6자리 등록값 (로봇 설정과 도어락에 같이 등록). 명령에는 숫자가 없다.
scene: v4
success:
  unlocked: true
  collisions_max: 0
  timeout_s: 240.0

dev:                        # 개발·튜닝에 쓴 시드 (tests/check_*.py) — 평가 시드와 겹치지 않음
  seeds: [0, 999]

splits:
  base:                     # 문 x ±0.3m, 도어락 높이 1.08~1.14m, 택배·사람 2~3개, 출발 ±0.3m ±15°
    condition: base
    seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009]
  variation:                # 문 x ±0.6m, 도어락 높이 1.02~1.20m · 가로 ±3cm, 택배·사람 2~3개, 출발 ±0.5m ±45°
    condition: variation
    seeds: [20000, 20001, 20002, 20003, 20004, 20005, 20006, 20007, 20008, 20009]
  # ---- 추가 반복 (주 SR 과 따로 보고) ----
  variation_ext:
    condition: variation
    seeds: [21000, 21001, 21002, 21003, 21004, 21005, 21006, 21007, 21008, 21009,
            21010, 21011, 21012, 21013, 21014, 21015, 21016, 21017, 21018, 21019,
            21020, 21021, 21022, 21023, 21024, 21025, 21026, 21027, 21028, 21029]

  stress:                   # 한계 분석(평가 범위 밖): 도어락 높이 0.92~1.32m, 장애물 3개, 출발 ±60°
    condition: stress
    seeds: [40000, 40001, 40002, 40003, 40004, 40005, 40006, 40007, 40008, 40009,
            40010, 40011, 40012, 40013, 40014, 40015, 40016, 40017, 40018, 40019]

# 20회 시도 명령: 두 표현을 번갈아 쓴다
trial_commands: ["현관문 열어줘", "집에 들어가자, 도어락 비밀번호 눌러 줄래?"]

# 명령 해석 점검 6회 (재표현 2, 대기·금지 2, 불가능 1, 모호 1). nlu/testset_v4_ko.yaml 에 넣지 않는다.
commands:
  condition: base
  items:
    - {seed: 30000, text: "우리 집 현관 좀 열어 줘",                expect: {intent: unlock},  kind: paraphrase}
    - {seed: 30001, text: "도착했으니 도어락 잠금 풀어줘",            expect: {intent: unlock},  kind: paraphrase}
    - {seed: 30002, text: "도어락은 누르지 말고 대기해",             expect: {intent: wait},    kind: forbidden}
    - {seed: 30003, text: "잠깐, 아무것도 건드리지 말고 가만히 있어",   expect: {intent: wait},    kind: forbidden}
    - {seed: 30004, text: "옆집 1204호 문 열어줘",                 expect: {intent: reject},  kind: impossible}
    - {seed: 30005, text: "버튼 하나 눌러줘",                      expect: {intent: clarify}, kind: ambiguous}
