# scene_v3 평가 설정 — 평가 '전에' 고정한다. 실패한 시도도 빼지 않는다.
# 작업: 텍스트 명령 -> 엘리베이터까지 주행(장애물 우회) -> 패널 확인·도킹 -> 숫자 판독 -> 피드백 누르기 -> 판단
# 성공 기준: 목표 버튼 slide 최대 변위 >= 10mm, 다른 버튼 < 3mm, 휠체어-벽/장애물 충돌 0 스텝
# 종료 조건: 미션 상태 기계가 DONE 에 도달하거나 시뮬레이션 시간 200s 초과(timeout)
# 실패 유형: nlu / nav(주행 시간 초과·막힘) / nav_collision / panel_not_found / dock / ik / digit(요청 층 판독 실패)
#           press_no_contact / press_force / wrong_button / contact / timeout / moved_when_forbidden
scene: v3
success:
  target_min_mm: 10.0
  other_max_mm: 3.0
  collisions_max: 0
  timeout_s: 200.0

dev:                        # 개발·튜닝에 쓴 시드 (tests/check_*.py) — 평가 시드와 겹치지 않음
  seeds: [0, 999]

splits:
  base:                     # 패널 벽 방향 ±0.2m / 높이 ±2cm, 장애물 0~1개(직선 경로 밖), 출발 ±0.3m ±15°
    condition: base
    seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009]
  variation:                # 패널 ±0.6m / ±6cm, 장애물 2~3개(직선 경로 막음 1, 패널 주위 1), 출발 ±0.5m ±45°
    condition: variation
    seeds: [20000, 20001, 20002, 20003, 20004, 20005, 20006, 20007, 20008, 20009]

  # ---- 추가 반복·한계 분석 (주 SR 과 따로 보고) ----
  variation_ext:            # 변화 조건 반복 30회 추가 (수치 신뢰도)
    condition: variation
    seeds: [21000, 21001, 21002, 21003, 21004, 21005, 21006, 21007, 21008, 21009,
            21010, 21011, 21012, 21013, 21014, 21015, 21016, 21017, 21018, 21019,
            21020, 21021, 21022, 21023, 21024, 21025, 21026, 21027, 21028, 21029]
  stress:                   # 한계 분석(평가 범위 밖): 패널 ±1.0m / ±10cm, 장애물 3개(경로 1 + 패널 주위 2), 출발 ±60°
    condition: stress
    seeds: [40000, 40001, 40002, 40003, 40004, 40005, 40006, 40007, 40008, 40009,
            40010, 40011, 40012, 40013, 40014, 40015, 40016, 40017, 40018, 40019]

# 20회 시도 명령 (목표 층은 시드에서 뽑힘). 두 표현을 번갈아 쓴다.
trial_commands: ["엘리베이터로 가서 {floor}층 눌러줘", "{floor}층 버튼 좀 눌러 줄래?"]

# 명령 해석 점검 6회 (재표현 2, 대기·금지 2, 불가능 1, 색 요청 1). nlu/testset_v3_ko.yaml 에 넣지 않는다.
commands:
  condition: base
  items:
    - {seed: 30000, text: "3층 버튼을 눌러줘",                  expect: {intent: press, floor: 3}, kind: paraphrase}
    - {seed: 30001, text: "엘리베이터 5층을 선택해 줘",           expect: {intent: press, floor: 5}, kind: paraphrase}
    - {seed: 30002, text: "버튼은 누르지 말고 대기해",            expect: {intent: wait},            kind: forbidden}
    - {seed: 30003, text: "잠깐, 아무것도 건드리지 말고 가만히 있어", expect: {intent: wait},       kind: forbidden}
    - {seed: 30004, text: "현재 장면에 없는 7층 버튼을 눌러줘",     expect: {intent: reject},          kind: impossible}
    - {seed: 30005, text: "파란 버튼 눌러줘",                    expect: {intent: clarify},         kind: ambiguous}
